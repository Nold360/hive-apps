---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bot-wrangler
  namespace: ingress-external
spec:
  plugin:
    bot-wrangler:
      enabled: true
      botAction: PROXY
      # Traefik proxies detected bots to the miasma tarpit (ClusterIP).
      botProxyUrl: "http://belladonna.belladonna.svc.cluster.local:8080"
      # Route ai-robots-txt and other traffic under /miasma so miasma can
      # serve the lure pages coherently.
      # robotsTxtFilePath: "/etc/miasma/robots.txt"
      # botBlockHttpCode: 403
      # useFastMatch: true
      # cacheUpdateInterval: "24h"
      # cacheSize: 500
      # logLevel: INFO
      # setNoArchiveHeader: true
