apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-kubeapi
  namespace: ingress-external
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  egress:
  - toEntities:
    - kube-apiserver
  - toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
