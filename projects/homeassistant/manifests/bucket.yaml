---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  clusterRef:
    name: garage
    namespace: garage
  quotas:
    maxSize: 100Gi
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: homeassistant-bucket-key
  namespace: homeassistant
spec:
  clusterRef:
    name: garage
    namespace: garage
  bucketPermissions:
    - bucketRef: 
        name: homeassistant
        namespace: homeassistant
      read: true
      write: true
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: allow-homeassistant
  namespace: garage
spec:
  from:
    - kind: GarageKey
      namespace: homeassistant
    - kind: GarageBucket
      namespace: homeassistant
  to:
    - kind: GarageCluster
      name: garage