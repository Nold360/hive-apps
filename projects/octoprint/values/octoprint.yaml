defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 20 # dialout
    fsGroup: 20

controllers:
  octoprint:
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/octoprint
          tag: "1.11.8"
          pullPolicy: IfNotPresent
        env:
          TZ: UTC
        probes:
          liveness:
            enabled: true
            type: TCP
            port: 5000
          readiness:
            enabled: true
            type: TCP
            port: 5000
        securityContext:
          privileged: true # /dev/prusa serial access

service:
  octoprint:
    controller: octoprint
    ports:
      http:
        port: 80
        targetPort: 5000
  octoprint-stream:
    controller: octoprint
    ports:
      http-stream:
        port: 80
        targetPort: 8080

persistence:
  config:
    type: persistentVolumeClaim
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: local-path
    advancedMounts:
      octoprint:
        app:
          - path: /config
  printer:
    type: hostPath
    hostPath: /dev/prusa
    advancedMounts:
      octoprint:
        app:
          - path: /dev/prusa

ingress:
  octoprint:
    enabled: true
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "OctoPrint"
      gethomepage.dev/group: "Tools"
      gethomepage.dev/icon: "octoprint"
      gethomepage.dev/description: "3D print control"
      cert-manager.io/cluster-issuer: vault-issuer
      nginx.ingress.kubernetes.io/proxy-body-size: 100m
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: octo.dc
        paths:
          - path: /
            service:
              identifier: octoprint
              port: http
          - path: /stream
            service:
              identifier: octoprint-stream
              port: http-stream
    tls:
      - hosts:
          - octo.dc
        secretName: octo-tls
