---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: hindsight
  namespace: hindsight
spec:
  clusterRef:
    name: garage
    namespace: garage
  quotas:
    maxSize: 100Gi
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: hindsight-bucket-key
  namespace: hindsight
spec:
  clusterRef:
    name: garage
    namespace: garage
  bucketPermissions:
    - bucketRef: 
        name: hindsight
        namespace: hindsight
      read: true
      write: true
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: allow-hindsight
  namespace: garage
spec:
  from:
    - kind: GarageKey
      namespace: hindsight
    - kind: GarageBucket
      namespace: hindsight
  to:
    - kind: GarageCluster
      name: garage
