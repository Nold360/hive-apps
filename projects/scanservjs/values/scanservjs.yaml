# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.0.1/charts/library/common/values.schema.json
defaultPodOptions:
  # Host network so the scanner (192.168.1.117) is reachable via saned/airscan
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  securityContext:
    fsGroup: 1000

controllers:
  scanservjs:
    containers:
      app:
        image:
          repository: docker.io/sbs20/scanservjs
          tag: latest
          pullPolicy: Always
        # See more environment variables in the scanservjs documentation:
        # https://scanservjs.org/docs
        env:
          TZ: "UTC"
          OCR_LANG: "deu+eng"
          SANED_NET_HOSTS: "192.168.1.0/24"
          AIRSCAN_DEVICES: "192.168.1.117"
          PIXMA_HOSTS: "192.168.1.117"
        # No documented health endpoint; use a TCP probe on the web port.
        probes:
          liveness:
            enabled: true
            type: TCP
            spec:
              tcpSocket:
                port: http
          readiness:
            enabled: true
            type: TCP
            spec:
              tcpSocket:
                port: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

service:
  main:
    controller: scanservjs
    ports:
      http:
        port: 8080

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    advancedMounts:
      scanservjs:
        app:
          - path: /app/config
  # Output lands where paperless picks it up
  output:
    type: hostPath
    hostPath: /data/paperless/import
    advancedMounts:
      scanservjs:
        app:
          - path: /app/data/output
  # Needed for local scanners
  dbus:
    type: hostPath
    hostPath: /var/run/dbus
    advancedMounts:
      scanservjs:
        app:
          - path: /var/run/dbus

ingress:
  main:
    enabled: true
    className: ingress-internal
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "ScanServJS"
      gethomepage.dev/group: "Documents"
      gethomepage.dev/icon: "scanservjs"
      gethomepage.dev/description: "Scanner server"
      cert-manager.io/cluster-issuer: vault-issuer
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: scan.dc
        paths:
          - path: /
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - scan.dc
        secretName: scan-tls
