apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bitmagnet-db
  namespace: bitmagnet
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie

  storage:
    size: 10Gi

  externalClusters:
    - name: bitmagnet-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-store
          serverName: bitmagnet-db

  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage-store
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: bitmagnet
  namespace: bitmagnet
spec:
  name: bitmagnet
  owner: bitmagnet
  cluster:
    name: bitmagnet-db
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bitmagnet-db-backup
  namespace: bitmagnet
spec:
  schedule: "0 0 * * * *"
  backupOwnerReference: self
  cluster:
    name: bitmagnet-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage-store
  namespace: bitmagnet
spec:
  retentionPolicy: "90d"
  configuration:
    destinationPath: s3://bitmagnet/
    endpointURL: http://garage.garage.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: bitmagnet-bucket-key
        key: access-key-id
      secretAccessKey:
        name: bitmagnet-bucket-key
        key: secret-access-key
      region:
        name: bitmagnet-bucket-key
        key: region
    wal:
      compression: gzip
