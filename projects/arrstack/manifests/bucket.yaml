---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: bitmagnet
  namespace: bitmagnet
spec:
  clusterRef:
    name: garage
    namespace: garage
  quotas:
    maxSize: 100Gi
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: bitmagnet-bucket-key
  namespace: bitmagnet
spec:
  clusterRef:
    name: garage
    namespace: garage
  bucketPermissions:
    - bucketRef:
        name: bitmagnet
        namespace: bitmagnet
      read: true
      write: true
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageReferenceGrant
metadata:
  name: allow-bitmagnet
  namespace: garage
spec:
  from:
    - kind: GarageKey
      namespace: bitmagnet
    - kind: GarageBucket
      namespace: bitmagnet
  to:
    - kind: GarageCluster
      name: garage
