# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.0.1/charts/library/common/values.schema.json

controllers:
  bitmagnet:
    containers:
      app:
        image:
          repository: ghcr.io/bitmagnet-io/bitmagnet
          tag: "v0.10.0"
        args:
          - worker
          - run
          - --all
        env:
          TZ: Europe/Berlin
          XDG_CONFIG_HOME: /config
          ## Postgres: all connection details come from the cnpg per-user secret
          ## (cluster is bootstrapped with user/db "app" — repo convention).
          POSTGRES_NAME:
            valueFrom:
              secretKeyRef:
                name: bitmagnet-db-app
                key: dbname
          POSTGRES_HOST:
            valueFrom:
              secretKeyRef:
                name: bitmagnet-db-app
                key: host
          POSTGRES_PORT:
            valueFrom:
              secretKeyRef:
                name: bitmagnet-db-app
                key: port
          POSTGRES_USER:
            valueFrom:
              secretKeyRef:
                name: bitmagnet-db-app
                key: username
          POSTGRES_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: bitmagnet-db-app
                key: password
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /status
                port: 3333
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    controller: bitmagnet
    ports:
      http:
        port: 3333

ingress:
  main:
    className: ingress-internal
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Bitmagnet"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "box"
      gethomepage.dev/description: "Torrent indexer & search"
      cert-manager.io/cluster-issuer: vault-issuer
      traefik.ingress.kubernetes.io/router.tls: 'true'
    hosts:
      - host: bitmagnet.dc
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - secretName: bitmagnet-tls
        hosts:
          - bitmagnet.dc

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: local-path
    advancedMounts:
      bitmagnet:
        app:
          - path: /config
