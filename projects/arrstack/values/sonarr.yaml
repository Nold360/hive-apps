image:
  repository: ghcr.io/home-operations/sonarr
  tag: 5.0.0

securityContext:
  privileged: true
  allowPrivilegeEscalation: true

ingress:
  main:
    enabled: true
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Sonarr"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "sonarr"
      gethomepage.dev/description: "TV collection"
      cert-manager.io/cluster-issuer: vault-issuer
      traefik.ingress.kubernetes.io/router.tls: 'true'
    hosts:
    - host: sonarr.dc
      paths:
      - path: /
        pathType: Prefix
    tls:
    - secretName: sonarr-tls
      hosts:
      - sonarr.dc

persistence:
  config:
    enabled: true
    #mountPath: /downloads
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
  media:
    enabled: true
    type: hostPath
    mountPath: /tvshows
    hostPath: /data/media/tvshows
    readOnly: false
  downloads:
    enabled: true
    type: hostPath
    mountPath: /downloads
    hostPath: /data/media/torrent
    readOnly: false
