#env:
#  UMASK: ""

image:
  pullPolicy: Always
  repository: tccr.io/truecharts/conreq
  tag: latest

persistence:
  config:
    enabled: true
    mountPath: /config

podSecurityContext:
  runAsGroup: 0
  runAsUser: 0
securityContext:
  readOnlyRootFilesystem: false
  runAsNonRoot: false

service:
  main:
    ports:
      main:
        port: 8000
        protocol: TCP
        targetPort: 8000

ingress:
  main:
    enabled: true
    enableFixedMiddlewares: false
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Conreq"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "box"
      gethomepage.dev/description: "Media requests"
      cert-manager.io/cluster-issuer: vault-issuer
      traefik.ingress.kubernetes.io/router.tls: 'true'
    hosts:
    - host: conreq.dc
      paths:
      - path: /
        pathType: Prefix
    tls:
    - secretName: conreq-tls
      hosts:
      - conreq.dc


portal:
  enabled: false
