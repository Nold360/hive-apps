# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.0.1/charts/library/common/values.schema.json                               service:
defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  main:
    ports:
      http:
        port: 9999
        targetPort: 9999

controllers:
  main:
    containers:
      main:
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
        image:
          repository: docker.io/austinweeks/miasma
          tag: latest
          pullPolicy: Always
        env:
          MIASMA_PORT: "9999"
          # Serve lure/robots content coherently under the same prefix Traefik
          # proxies bots to (bot-wrangler botProxyUrl -> /miasma).
          MIASMA_LINK_PREFIX: "/miasma"
          MIASMA_NUM_WORKER_TABS: "1"
          # Seed/randomness for generated trap pages and short-link IDs.
          MIASMA_SHORT_LINK_SALT: "grimbimbelfoo42"
          # Expose Miasma's metrics at /metrics on the main port (9999).
          MIASMA_METRICS_ENDPOINT: "/metrics"
        # miasma serves on port 9999; use a TCP socket probe rather than an
        # unverified HTTP path to avoid CrashLoop while we confirm /healthz.
        probes:
          liveness:
            enabled: true
            type: TCP
            spec:
              tcpSocket:
                port: http
          readiness:
            enabled: true
            type: TCP
            spec:
              tcpSocket:
                port: http

serviceMonitor:
  main:
    enabled: true
    endpoints:
      - port: http
        path: /metrics
        scheme: http
        interval: 60s