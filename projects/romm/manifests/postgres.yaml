apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: romm-db
  namespace: romm
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie

  storage:
    size: 10Gi

  externalClusters:
    - name: romm-db
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: garage-store
          serverName: romm-db

  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage-store
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: romm
spec:
  name: romm
  owner: romm
  cluster:
    name: romm-db
  extensions:
  - name: vector
    # renovate: suite=trixie-pgdg depName=postgresql-18-pgvector extractVersion=^(?<version>\d+\.\d+\.\d+)
    version: '0.8.6'
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: romm-db-backup
  namespace: romm
spec:
  schedule: "0 0 * * * *"
  backupOwnerReference: self
  cluster:
    name: romm-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage-store
  namespace: romm
spec:
  retentionPolicy: "90d"
  configuration:
    destinationPath: s3://romm/
    endpointURL: http://garage.garage.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: romm-bucket-key
        key: access-key-id
      secretAccessKey:
        name: romm-bucket-key
        key: secret-access-key
      region:
        name: romm-bucket-key
        key: region
    wal:
      compression: gzip