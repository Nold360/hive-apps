# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-5.0.1/charts/library/common/values.schema.json                               service:
defaultPodOptions:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  romm:
    containers:
      app:
        image:
          repository: ghcr.io/rommapp/romm
          tag: 5.2.0@sha256:3512f2ca455782f90247271bed23116e6bc675bc74e379be2c41696e607ab11e

        envFrom:
          - secretRef:
              name: romm

        env:
          ROMM_PORT: &port 8080
          ROMM_DB_DRIVER: postgresql
          POSTGRES_DB: app
          POSTGRES_USER: app
          DB_HOST: romm-db-rw

          REDIS_DB: "2"

          # Scrapers / scheduled jobs
          ENABLE_SCHEDULED_RESCAN: "true"
          SCHEDULED_RESCAN_CRON: "0 3 * * *"
          ENABLE_SCHEDULED_UPDATE_SWITCH_TITLEDB: "false"
          ENABLE_SCHEDULED_UPDATE_MAME_XML: "false"
          ENABLE_RESCAN_ON_FILESYSTEM_CHANGE: "true"
          RESCAN_ON_FILESYSTEM_CHANGE_DELAY: 5
          FLASHPOINT_API_ENABLED: true
          HLTB_API_ENABLED: true
          HASHEOUS_API_ENABLED: true
          LAUNCHBOX_API_ENABLED: true
          ENABLE_SCHEDULED_UPDATE_LAUNCHBOX_METADATA: true
          PLAYMATCH_API_ENABLED: true
          # TheGamesDB: keyless public API, capped 1000 req/month for unregistered.
          # Plenty for periodic library scans on a personal collection.
          TGDB_API_ENABLED: true

          # Bump from default 14400 (4h) so a full COMPLETE scan of
          # ~10k ROMs through 10 metadata sources fits in one job
          # without RQ JobTimeoutException.
          SCAN_TIMEOUT: 28800

        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/heartbeat
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness: *probes
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10

        resources:
          requests:
            cpu: 25m
            memory: 512Mi
          limits:
            memory: 5Gi

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

service:
  romm:
    controller: romm
    ports:
      http:
        port: *port

persistence:
  romm:
    type: persistentVolumeClaim
    size: 10Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      romm:
        app:
          - path: /romm/resources
            subPath: resources
          - path: /romm/assets
            subPath: assets
          - path: /romm/config
            subPath: config

  games:
    type: hostPath
    hostPath: /data/consoles/roms
    advancedMounts:
      romm:
        app:
          - path: /romm/library
  
  tmp:
    type: emptyDir
    medium: Memory
    advancedMounts:
      romm:
        app:
          - path: /tmp


ingress:
  romm:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: vault-issuer
    hosts:
      - host: "roms.dc"
        paths:
          - path: /
            service:
              identifier: romm
              port: *port
    tls:
      - hosts:
          - roms.dc
        secretName: romm-tls