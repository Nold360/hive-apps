# Traefik forwardAuth Middleware.
# Name MUST match the annotation used on every ingress:
#   traefik.ingress.kubernetes.io/router.middlewares: authentik-forwardauth@kubernetescrd
# It points at the authentik embedded outpost which resolves the correct
# proxy provider via X-Forwarded-Host.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-preferred-language
      - X-authentik-attributes
