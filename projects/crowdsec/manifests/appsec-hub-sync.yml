# Daily recycle of the AppSec pod so it re-runs the entrypoint hub update and
# reloads the freshly downloaded L7 virtual-patching (vpatch-CVE-*) rules.
#
# The AppSec binary loads its rules once at startup (no hot-reload / SIGHUP /
# fsnotify in v1.8.2), so new hub content only takes effect on a pod restart.
# The entrypoint's built-in `run_hub_update` (gated on /etc/crowdsec/hub being
# a volume, see appsec-hub-pvc.yml) downloads the new rules on each start; this
# CronJob is what triggers the periodic start.
#
# RBAC is scoped to the crowdsec namespace and limited to listing/deleting pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-appsec-sync
  namespace: crowdsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-appsec-sync
  namespace: crowdsec
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-appsec-sync
  namespace: crowdsec
subjects:
  - kind: ServiceAccount
    name: crowdsec-appsec-sync
    namespace: crowdsec
roleRef:
  kind: Role
  name: crowdsec-appsec-sync
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crowdsec-appsec-restart
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec-appsec-restart
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: crowdsec-appsec-sync
          containers:
            - name: restart
              image: lachlanevenson/k8s-kubectl:latest
              command:
                - kubectl
                - -n
                - crowdsec
                - delete
                - pod
                - -l
                - k8s-app=crowdsec,type=appsec
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          restartPolicy: OnFailure
